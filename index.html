<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Send your photo to Dadrwal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #0f0f14;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 360px;
  background: #1c1c25;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.6);
  text-align: center;
}

h2 {
  margin-bottom: 12px;
}

video, img {
  width: 100%;
  border-radius: 12px;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

.open { background: #4caf50; color: white; }
.capture { background: #2196f3; color: white; }
.send { background: #ff9800; color: black; }
.success {
  display: none;
  margin-top: 10px;
  background: #00c853;
  padding: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">
  <h2>📷 Send your photo to Dadrwal</h2>

  <video id="video" autoplay playsinline></video>
  <img id="preview" style="display:none;">

  <button class="open" onclick="startCamera()">Open Camera</button>
  <button class="capture" onclick="capturePhoto()">Capture</button>
  <button class="send" onclick="uploadImage()" style="display:none;">Send Image</button>

  <div class="success" id="success">✅ Image uploaded successfully!</div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let preview = document.getElementById("preview");
let sendBtn = document.querySelector(".send");
let successBox = document.getElementById("success");
let imageBlob = null;

// Start camera
function startCamera() {
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(stream => video.srcObject = stream)
    .catch(() => alert("Camera access denied"));
}

// Capture image
function capturePhoto() {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);

  canvas.toBlob(blob => {
    imageBlob = blob;
    preview.src = URL.createObjectURL(blob);
    preview.style.display = "block";
    sendBtn.style.display = "block";
  }, "image/jpeg", 0.95);
}

// Upload to Cloudinary
function uploadImage() {
  if (!imageBlob) return alert("No image captured");

  let formData = new FormData();
  formData.append("file", imageBlob);
  formData.append("upload_preset", "GitHub");

  fetch("https://api.cloudinary.com/v1_1/dikshit/image/upload", {
    method: "POST",
    body: formData
  })
  .then(res => res.json())
  .then(() => {
    successBox.style.display = "block";
    setTimeout(resetPage, 2000);
  })
  .catch(() => alert("Upload failed"));
}

// Reset page
function resetPage() {
  preview.style.display = "none";
  sendBtn.style.display = "none";
  successBox.style.display = "none";
  imageBlob = null;
}
</script>

</body>
</html>
