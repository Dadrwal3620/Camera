<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Upload</title>

<style>
body{
    margin:0;
    background:black;
    color:white;
    font-family:Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
}
video, img{
    width:100%;
    max-width:400px;
    border-radius:15px;
}
button{
    margin-top:15px;
    padding:12px 20px;
    border:none;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
}
#capture{background:white;color:black;}
#upload{background:#3B82F6;color:white;}
#retake{background:#444;color:white;}
.hidden{display:none;}
</style>
</head>

<body>

<h2>Camera Upload</h2>

<video id="video" autoplay playsinline></video>
<img id="preview" class="hidden">
<canvas id="canvas" class="hidden"></canvas>

<button id="capture">Capture</button>
<button id="retake" class="hidden">Retake</button>
<button id="upload" class="hidden">Send to Cloudinary</button>

<script>

// =====================
// YOUR CLOUDINARY INFO
// =====================
const CLOUD_NAME = "dikshit";
const UPLOAD_PRESET = "GitHub";
// =====================

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const preview = document.getElementById("preview");
const captureBtn = document.getElementById("capture");
const uploadBtn = document.getElementById("upload");
const retakeBtn = document.getElementById("retake");

let imageData = null;

// Start camera
async function startCamera(){
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    video.srcObject = stream;
}
startCamera();

// Capture image
captureBtn.onclick = () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video,0,0);

    imageData = canvas.toDataURL("image/jpeg",0.9);

    preview.src = imageData;
    preview.classList.remove("hidden");

    video.classList.add("hidden");
    captureBtn.classList.add("hidden");

    uploadBtn.classList.remove("hidden");
    retakeBtn.classList.remove("hidden");
};

// Retake
retakeBtn.onclick = () => {
    preview.classList.add("hidden");
    video.classList.remove("hidden");
    captureBtn.classList.remove("hidden");

    uploadBtn.classList.add("hidden");
    retakeBtn.classList.add("hidden");
};

// Upload to Cloudinary
uploadBtn.onclick = async () => {

    uploadBtn.innerText = "Uploading...";

    const formData = new FormData();
    formData.append("file", imageData);
    formData.append("upload_preset", UPLOAD_PRESET);

    try{
        const response = await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
            {
                method:"POST",
                body:formData
            }
        );

        const data = await response.json();

        if(data.secure_url){
            alert("Upload Successful!");
            location.reload();
        }else{
            alert("Upload Failed!");
        }

    }catch(err){
        alert("Error uploading image.");
    }
};

</script>

</body>
</html>
