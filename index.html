<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Send Photo to Dadrwal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

body{
    background:#000;
    height:100vh;
    overflow:hidden;
}

/* FULLSCREEN CAMERA */
#cameraScreen{
    position:fixed;
    inset:0;
    background:#000;
    display:none;
}

video{
    width:100vw;
    height:100vh;
    object-fit:cover;
}

/* TOP BAR */
.top-bar{
    position:absolute;
    top:15px;
    width:100%;
    text-align:center;
    color:#fff;
    font-size:18px;
    font-weight:600;
    z-index:5;
}

/* BOTTOM CONTROLS */
.controls{
    position:absolute;
    bottom:30px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:20px;
    z-index:5;
}

button{
    border:none;
    padding:14px 26px;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
}

.open{
    background:#00e676;
    color:#000;
}

.capture{
    background:#2196f3;
    color:#fff;
}

.send{
    background:#ff9800;
    color:#000;
}

/* PREVIEW SCREEN */
#previewScreen{
    position:fixed;
    inset:0;
    background:#0f0f14;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
}

#previewScreen img{
    width:100%;
    max-width:420px;
    border-radius:18px;
    box-shadow:0 20px 50px rgba(0,0,0,.6);
}

.success{
    margin-top:15px;
    background:#00c853;
    color:#000;
    padding:12px 20px;
    border-radius:14px;
    display:none;
    font-weight:600;
}
</style>
</head>

<body>

<!-- CAMERA SCREEN -->
<div id="cameraScreen">
    <div class="top-bar">📷 Capture your photo</div>
    <video id="video" autoplay playsinline></video>
    <div class="controls">
        <button class="capture" id="captureBtn">Capture</button>
    </div>
</div>

<!-- PREVIEW SCREEN -->
<div id="previewScreen">
    <img id="preview">
    <button class="send" id="sendBtn">Send Image</button>
    <div class="success" id="successMsg">✅ Image sent successfully</div>
</div>

<!-- START BUTTON -->
<div id="startScreen" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f0f14;">
    <button class="open" id="openCamera">Open Camera</button>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
const openCameraBtn = document.getElementById("openCamera");
const cameraScreen = document.getElementById("cameraScreen");
const previewScreen = document.getElementById("previewScreen");
const video = document.getElementById("video");
const captureBtn = document.getElementById("captureBtn");
const preview = document.getElementById("preview");
const sendBtn = document.getElementById("sendBtn");
const successMsg = document.getElementById("successMsg");
const canvas = document.getElementById("canvas");

let stream;

// OPEN CAMERA (FRONT PRIORITY)
openCameraBtn.onclick = async () => {
    document.getElementById("startScreen").style.display = "none";
    cameraScreen.style.display = "block";

    stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio:false
    });

    video.srcObject = stream;
};

// CAPTURE PHOTO
captureBtn.onclick = () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0);

    preview.src = canvas.toDataURL("image/jpeg", 1.0);

    // stop camera
    stream.getTracks().forEach(t => t.stop());

    cameraScreen.style.display = "none";
    previewScreen.style.display = "flex";
};

// SEND IMAGE (placeholder)
sendBtn.onclick = () => {
    successMsg.style.display = "block";
};
</script>

</body>
</html>
