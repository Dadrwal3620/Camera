<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SecureUpload | Dadrwal</title>

<style>
    :root {
        /* Design Tokens */
        --primary: #3B82F6; /* Modern Blue */
        --primary-active: #2563EB;
        --danger: #EF4444;
        --surface: rgba(20, 20, 20, 0.6);
        --surface-border: rgba(255, 255, 255, 0.1);
        --text-main: #FFFFFF;
        --text-muted: #9CA3AF;
        --radius-lg: 24px;
        --radius-full: 9999px;
        --transition: cubic-bezier(0.4, 0, 0.2, 1);
        --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Reset & Base */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
        background-color: #000;
        color: var(--text-main);
        font-family: var(--font-stack);
        height: 100dvh; /* Dynamic viewport height for mobile */
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* --- Typography & Icons --- */
    h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
    p { font-size: 15px; color: var(--text-muted); line-height: 1.5; }
    
    svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* --- Views Controller --- */
    .view {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s var(--transition), transform 0.4s var(--transition);
        transform: scale(0.98);
        z-index: 1;
    }

    .view.active {
        opacity: 1;
        pointer-events: all;
        transform: scale(1);
        z-index: 10;
    }

    /* --- 1. Landing View --- */
    #view-landing {
        background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
        padding: 40px;
        text-align: center;
    }

    .logo-area {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, var(--primary), #60A5FA);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        box-shadow: 0 20px 40px -10px rgba(59, 130, 246, 0.5);
    }
    
    .logo-area svg { width: 40px; height: 40px; stroke: white; }

    .btn-primary {
        margin-top: 40px;
        background: var(--text-main);
        color: #000;
        border: none;
        padding: 16px 32px;
        border-radius: var(--radius-full);
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 10px;
    }
    
    .btn-primary:active { transform: scale(0.96); }

    /* --- 2. Camera View --- */
    #view-camera { background: #000; }

    video {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .camera-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: max(20px, env(safe-area-inset-top)) 20px max(40px, env(safe-area-inset-bottom));
        z-index: 20;
    }

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .icon-btn {
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        color: white;
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: background 0.2s;
    }
    .icon-btn:active { background: rgba(255,255,255,0.3); }

    .bottom-controls {
        display: flex;
        justify-content: center; /* Center the shutter */
        align-items: center;
        position: relative;
        width: 100%;
    }

    /* Shutter Button */
    .shutter-ring {
        width: 80px;
        height: 80px;
        border: 4px solid white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.1s;
    }
    
    .shutter-inner {
        width: 64px;
        height: 64px;
        background: white;
        border-radius: 50%;
        transition: transform 0.2s;
    }
    
    .shutter-ring:active { transform: scale(0.95); }
    .shutter-ring:active .shutter-inner { transform: scale(0.9); }

    /* Flash Animation */
    #flash {
        position: fixed;
        inset: 0;
        background: white;
        opacity: 0;
        pointer-events: none;
        z-index: 50;
        transition: opacity 0.1s ease-out;
    }

    /* --- 3. Preview View --- */
    #view-preview {
        background: #000;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
    }

    .preview-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    .image-wrapper {
        flex: 1;
        position: relative;
        margin: 20px;
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        background: #111;
    }

    #preview-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .preview-actions {
        padding: 0 24px 30px;
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 16px;
    }

    .btn-secondary {
        background: #333;
        color: white;
        border: none;
        padding: 16px;
        border-radius: var(--radius-full);
        font-weight: 600;
        cursor: pointer;
    }

    .btn-send {
        background: var(--primary);
        color: white;
        border: none;
        padding: 16px;
        border-radius: var(--radius-full);
        font-weight: 600;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
    }
    
    .btn-send:disabled {
        background: #333;
        color: #777;
        cursor: not-allowed;
    }

    /* --- Toast Notification --- */
    .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(-100px);
        background: rgba(30, 30, 30, 0.9);
        backdrop-filter: blur(12px);
        padding: 12px 24px;
        border-radius: var(--radius-full);
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        border: 1px solid var(--surface-border);
        z-index: 100;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .toast.visible { transform: translateX(-50%) translateY(0); }
    .toast-success { color: #4ade80; }

    /* --- Loading Spinner --- */
    .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        display: none;
    }
    
    .btn-send.loading .spinner { display: block; }
    .btn-send.loading span { display: none; } /* Hide text when loading */

    @keyframes spin { to { transform: rotate(360deg); } }

</style>
</head>
<body>

    <div id="flash"></div>

    <div id="toast" class="toast">
        <svg class="toast-success" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span id="toast-msg">Image sent successfully</span>
    </div>

    <section id="view-landing" class="view active">
        <div class="logo-area">
            <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        </div>
        <h1>Photo Uploader</h1>
        <p>Securely capture and send photos directly to Dadrwal.</p>
        <button class="btn-primary" id="btn-start">
            <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path></svg>
            Open Camera
        </button>
    </section>

    <section id="view-camera" class="view">
        <video id="video" autoplay playsinline muted></video>
        
        <div class="camera-overlay">
            <div class="top-bar">
                <button class="icon-btn" id="btn-close-cam">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                <button class="icon-btn" id="btn-switch-cam">
                    <svg viewBox="0 0 24 24"><path d="M20 10c0-6-8-6-8-6s-8 0-8 6h2c0-4 6-4 6-4s6 0 6 4h2zM4 14c0 6 8 6 8 6s8 0 8-6h-2c0 4-6 4-6 4s-6 0-6-4H4z"></path></svg>
                </button>
            </div>
            
            <div class="bottom-controls">
                <div class="shutter-ring" id="btn-capture">
                    <div class="shutter-inner"></div>
                </div>
            </div>
        </div>
    </section>

    <section id="view-preview" class="view">
        <div class="preview-container">
            <div class="image-wrapper">
                <img id="preview-img" alt="Capture Preview">
            </div>
            <div class="preview-actions">
                <button class="btn-secondary" id="btn-retake">Retake</button>
                <button class="btn-send" id="btn-send">
                    <span>Send Photo</span>
                    <div class="spinner"></div>
                </button>
            </div>
        </div>
    </section>

    <canvas id="canvas" style="display:none;"></canvas>

<script>
/**
 * ULTRA-PROFESSIONAL APP LOGIC
 * Features: State mgmt, Camera Switching, Animations, Error Handling
 */

// --- STATE MANAGEMENT ---
const state = {
    stream: null,
    facingMode: 'user', // 'user' (front) or 'environment' (back)
    imageData: null
};

// --- DOM ELEMENTS ---
const els = {
    views: {
        landing: document.getElementById('view-landing'),
        camera: document.getElementById('view-camera'),
        preview: document.getElementById('view-preview')
    },
    video: document.getElementById('video'),
    canvas: document.getElementById('canvas'),
    previewImg: document.getElementById('preview-img'),
    flash: document.getElementById('flash'),
    toast: document.getElementById('toast'),
    btns: {
        start: document.getElementById('btn-start'),
        closeCam: document.getElementById('btn-close-cam'),
        switchCam: document.getElementById('btn-switch-cam'),
        capture: document.getElementById('btn-capture'),
        retake: document.getElementById('btn-retake'),
        send: document.getElementById('btn-send')
    }
};

// --- NAVIGATION ---
function switchView(viewName) {
    // Hide all
    Object.values(els.views).forEach(el => el.classList.remove('active'));
    // Show target
    els.views[viewName].classList.add('active');
}

// --- CAMERA FUNCTIONS ---
async function startCamera() {
    try {
        if (state.stream) {
            state.stream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
            video: {
                facingMode: state.facingMode,
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            },
            audio: false
        };

        state.stream = await navigator.mediaDevices.getUserMedia(constraints);
        els.video.srcObject = state.stream;
        switchView('camera');
        
    } catch (err) {
        console.error("Camera Error:", err);
        showToast("Access denied or camera unavailable", true);
    }
}

function stopCamera() {
    if (state.stream) {
        state.stream.getTracks().forEach(track => track.stop());
        state.stream = null;
    }
}

// --- ACTIONS ---

// 1. Start Button
els.btns.start.onclick = () => {
    startCamera();
};

// 2. Switch Camera (Front/Back)
els.btns.switchCam.onclick = () => {
    state.facingMode = state.facingMode === 'user' ? 'environment' : 'user';
    // Rotate animation
    els.btns.switchCam.style.transform = "rotate(180deg)";
    setTimeout(() => els.btns.switchCam.style.transform = "rotate(0deg)", 300);
    startCamera();
};

// 3. Close Camera
els.btns.closeCam.onclick = () => {
    stopCamera();
    switchView('landing');
};

// 4. Capture
els.btns.capture.onclick = () => {
    // Flash Animation
    els.flash.style.opacity = 1;
    setTimeout(() => els.flash.style.opacity = 0, 100);

    // Capture Logic
    const width = els.video.videoWidth;
    const height = els.video.videoHeight;
    
    els.canvas.width = width;
    els.canvas.height = height;
    
    const ctx = els.canvas.getContext('2d');
    
    // Mirror the image if using front camera
    if (state.facingMode === 'user') {
        ctx.translate(width, 0);
        ctx.scale(-1, 1);
    }
    
    ctx.drawImage(els.video, 0, 0, width, height);
    
    // Convert to URL
    state.imageData = els.canvas.toDataURL('image/jpeg', 0.95); // High quality
    els.previewImg.src = state.imageData;
    
    // Transition
    switchView('preview');
};

// 5. Retake
els.btns.retake.onclick = () => {
    switchView('camera');
};

// 6. Send (Simulated Network Request)
els.btns.send.onclick = () => {
    const btn = els.btns.send;
    
    if(btn.classList.contains('loading')) return;

    // UI Loading State
    btn.classList.add('loading');
    
    // Simulate API Call (2 seconds)
    setTimeout(() => {
        btn.classList.remove('loading');
        showToast("Photo sent successfully!");
        
        // Reset app after success
        setTimeout(() => {
            stopCamera();
            switchView('landing');
        }, 1500);
    }, 2000);
};

// --- UTILITIES ---
function showToast(message, isError = false) {
    const toast = els.toast;
    document.getElementById('toast-msg').innerText = message;
    
    if (isError) {
        toast.querySelector('svg').style.color = '#EF4444'; // Red
    } else {
        toast.querySelector('svg').style.color = '#4ade80'; // Green
    }
    
    toast.classList.add('visible');
    
    setTimeout(() => {
        toast.classList.remove('visible');
    }, 3000);
}

// Initial Permissions Check (Optional: helps browser trust the app)
navigator.permissions.query({name: 'camera'}).then(res => {
    // console.log("Camera Status: " + res.state);
});

</script>
</body>
</html>
